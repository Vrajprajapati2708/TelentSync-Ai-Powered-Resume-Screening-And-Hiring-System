# ============================================================
#  TalentSync / HireAI — Production Docker Compose Stack
#  Orchestrates Web (Gunicorn/Flask), PostgreSQL 16, and Redis 7.
# ============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireai_web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-hireai_production_secret_key_change_me_2026}
      - DATABASE_URL=postgresql://hireai_user:${DB_PASSWORD:-hireai_secure_pass_2026}@postgres:5432/hireai_db
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - UPLOAD_FOLDER=/app/uploads/resumes
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    volumes:
      - resume_storage:/app/uploads/resumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hireai_network

  postgres:
    image: postgres:16-alpine
    container_name: hireai_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=hireai_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hireai_secure_pass_2026}
      - POSTGRES_DB=hireai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireai_user -d hireai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hireai_network

  redis:
    image: redis:7-alpine
    container_name: hireai_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hireai_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  resume_storage:
    driver: local

networks:
  hireai_network:
    driver: bridge
